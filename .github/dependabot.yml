version: 2
updates:
  # This repo has only bun.lock (no npm lockfile). The former "npm" entries
  # never touched it; "bun" is GA since Feb 2025 and rewrites bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      root-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript must stay on 6.x: scripts/comment-scan.ts and two server
      # tests use the classic JS API (createScanner, createProgram), which
      # TS7 removed from require('typescript'). Type checking itself runs in
      # Oxlint's bundled tsgolint. See CLAUDE.md "TypeScript".
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "bun"
    directory: "/wiki"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      wiki-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
