name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans `git log -p`; a shallow clone silently scans
          # only the tip commit and reports a clean history that was never
          # actually read. fetch-depth: 0 is required.
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 git \
            --no-banner --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
