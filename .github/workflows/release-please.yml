name: Release Please

on:
  push:
    branches:
      - main
  # Recovery path. A publish that fails (expired npm token, registry outage)
  # leaves the version tagged but unpublished, and re-running this workflow
  # cannot fix it: release-please reports `release_created: false` once the
  # release exists, so `publish` would skip. Dispatch the tag instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to npm (e.g. v1.32.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Dispatch is for publishing an existing tag; it must never cut a release.
    if: github.event_name == 'push'
    # A newer push cancels a pass still in flight. release-please reads the
    # files it bumps (package.json) early and commits them late, on top of
    # whatever main is by then; a pass that read before a merge and wrote
    # after it reverted that merge's package.json change in the release PR
    # (#1168 put @legendapp/list back to the version #1166 had just bumped,
    # so `bun install --frozen-lockfile` failed). The newer pass cannot
    # repair it afterwards, because release-please leaves a PR alone when its
    # notes are unchanged. Cancelling narrows the window to cancel-delivery
    # latency; it does not close it. Job-level on purpose: `publish` must
    # never be cancelled mid-publish.
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT (not the default GITHUB_TOKEN) so the release PR's commits
          # trigger the test.yml `pull_request` workflow. A PR opened with
          # GITHUB_TOKEN never fires further workflow runs, so the required
          # check stays "pending" forever and the PR can only be admin-merged.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `!cancelled()` is required: on dispatch the `release-please` job is
    # skipped, and a skipped dependency would otherwise skip this job too.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      # Verification here is ADVISORY — a failure is reported on the step and
      # the publish proceeds anyway. By the time this job runs the version is
      # already tagged and the release already exists, so a failing gate does
      # not prevent a bad release, it only strands a tagged one unpublished —
      # recoverable solely through the `workflow_dispatch` path above. v1.58.1
      # was stranded exactly that way by the hang watchdog's SIGKILL (exit 137).
      # The blocking gate is `test.yml` on `main`, which runs before
      # release-please ever cuts the release.
      - name: Run tests (advisory)
        continue-on-error: true
        run: timeout --foreground --signal=SIGTERM --kill-after=10 420 bash scripts/ci-test-with-hang-diagnostics.sh
        env:
          GIT_TERMINAL_PROMPT: "0"
          HANG_AFTER: "170"

      # Non-blocking too: a failed browser install would otherwise fail the job
      # and block the publish on behalf of a smoke test that cannot block it.
      - name: Install Playwright browsers
        continue-on-error: true
        run: bunx playwright install chrome --with-deps

      - name: Page-level smoke test (production bundle, advisory)
        continue-on-error: true
        run: bun run test:smoke
        env:
          KANNA_OTEL: disabled

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@cuongtran001"
          # setup-node >=v5 auto-caches when package.json has a
          # `packageManager` field; ours says bun@1.3.11 and there is no
          # package-lock.json, so letting it probe risks a hard "lock file not
          # found" failure. This job only runs `npm publish` — it never
          # installs — so caching buys nothing. PR CI does NOT exercise this
          # job (it runs only on a real release), so failing here would first
          # surface mid-release. Disable it explicitly.
          package-manager-cache: false

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
