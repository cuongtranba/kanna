name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests boot real Kanna servers; telemetry defaults ON, so without this
      # every CI run phones home to the collector as kanna-runnervm<random>
      # and pollutes the fleet dashboard's machine list.
      KANNA_OTEL: disabled
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: useState gate (ast-grep)
        run: bun run lint:usestate

      - name: Type check
        run: bun run typecheck

      - run: bun run build

      - name: Run tests
        run: timeout --foreground --signal=SIGTERM --kill-after=10 420 bash scripts/ci-test-with-hang-diagnostics.sh
        env:
          GIT_TERMINAL_PROMPT: "0"
          HANG_AFTER: "170"
