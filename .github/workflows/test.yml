name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests boot real Kanna servers; telemetry defaults ON, so without this
      # every CI run phones home to the collector as kanna-runnervm<random>
      # and pollutes the fleet dashboard's machine list.
      KANNA_OTEL: disabled
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: useState gate (ast-grep)
        run: bun run lint:usestate

      - name: No code comments
        run: bun run lint:comments

      - name: Architecture budget (ratchet)
        run: bun run check:arch

      - name: Complexity ceilings still tight
        run: bun run lint:limits

      - name: Type check
        run: bun run typecheck

      - run: bun run build

      - name: Bundle size + CJS interop check
        run: bun run check:bundle

      - name: Run tests
        run: timeout --foreground --signal=SIGTERM --kill-after=10 420 bash scripts/ci-test-with-hang-diagnostics.sh
        env:
          GIT_TERMINAL_PROMPT: "0"
          HANG_AFTER: "170"

  # The Windows 7 beacon (apps/beacon-win7) is a Go 1.20 module: Go 1.20 is the
  # last release whose runtime still runs on Windows 7, so the pin is the
  # point, not an oversight. Vet + test run on Linux and Windows; the Windows
  # binaries are cross-built for both architectures on each.
  beacon-win7:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/beacon-win7
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.20.14"
          cache-dependency-path: apps/beacon-win7/go.sum

      # Go 1.20 does not enforce a dependency's `go` directive, so a module
      # that needs a newer toolchain would only fail at some later build.
      - name: Every dependency declares go <= 1.20
        run: |
          go list -m -f '{{.Path}} {{.GoVersion}}' all | awk '
            { split($2, v, "."); if (v[1] > 1 || (v[1] == 1 && v[2] > 20)) { print "needs go " $2 ": " $1; bad = 1 } }
            END { exit bad }'

      - run: go vet ./...

      - run: go test ./...

      - name: Cross-build the Windows binaries
        run: |
          for arch in amd64 386; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "bin/kanna-beacon-$arch.exe" ./cmd/kanna-beacon
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H=windowsgui" -o "bin/kanna-beacon-tray-$arch.exe" ./cmd/kanna-beacon-tray
          done

      # A DLL in the static import table must exist before the program's first
      # instruction runs; Go loads everything else lazily. kernel32.dll is all
      # a Go 1.20 binary imports, so any addition is a Windows 8+ dependency
      # until proven otherwise.
      - name: Windows binaries import only kernel32.dll
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/peimports -allow kernel32.dll bin/*.exe

  # A commit message release-please cannot parse is dropped from the changelog
  # AND from the version bump, silently, with a green build (#1057, #1047). This
  # job is the only thing that observes it. PR-only: it needs the PR's own
  # commit range, and the squash message it predicts is the PR title plus those
  # commits.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate reads every commit in the range, so the shallow default
          # would leave it with nothing to check and pass vacuously.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Commit messages parse for release-please
        # The title rides an env var rather than a `${{ }}` interpolation: it is
        # attacker-controlled on a fork PR, and interpolating it into `run:`
        # would put it in the shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:commits --range "$BASE_SHA..HEAD" --title "$PR_TITLE"
