title = "Kanna"

# All 14 findings baseline (main @ 040123b9) are generic-api-key in test
# fixtures — zero real credentials. This config tunes the allowlist so CI
# passes on every subsequent push without silently hiding new leaks.

[allowlist]
  description = "Synthetic tokens and public keys in test fixtures"

  # Match against the whole source line so we can anchor on the context
  # that proves a value is synthetic (sequential chars, well-known test
  # prefixes, public key constants).
  regexTarget = "line"

  regexes = [
    # mask-oauth-key.test.ts — synthetic Anthropic OAuth tokens used to
    # exercise the masking function; pattern is recognisable as a fake.
    '''sk-ant-oat01-[a-zA-Z0-9]+''',

    # agent.oauth-account-info.test.ts, agent.openrouter-*.test.ts —
    # synthetic OpenRouter API-key stub (abcdef1234567890 is sequential).
    '''sk-or-v1-[a-z0-9]{16}''',

    # pushClient.test.ts — VAPID *public* key used to test URL-safe
    # base64 decoding; public keys are not secrets.
    '''BPg4MhSNQjK4FjoUf4f9Ye_K2gM4ahK_5BWj9rYjZ8sHbqJj9oKkrFHBwZJh1XJF8AaXh''',
  ]

  # Case-insensitive substrings matched against the extracted secret value.
  # A match causes the finding to be skipped.  Every entry here is a value
  # that appears ONLY in test assertions and is provably not a credential:
  # - "sk-ant-test" / "sk-ant-abc" / "sk-ant-bad" / "sk-ant-existing" —
  #   short dummy keys used in env-var propagation tests.
  # - "sk-ant-abcdef1234" — sequential stub key in spawner tests.
  # - "should-be-stripped" — plaintext label used to assert token removal.
  # - "leftover" — placeholder in an env-map assertion.
  # - "sk-or-test" — short OpenRouter stub.
  # - "oauth-123" / "inherited" — tiny OAuth-token stubs.
  stopwords = [
    "sk-ant-test",
    "sk-ant-abc",
    "sk-ant-bad",
    "sk-ant-existing",
    "sk-ant-abcdef1234",
    "should-be-stripped",
    "leftover",
    "sk-or-test",
    "oauth-123",
    "inherited",
    "sk-ant-oat-test",
  ]
