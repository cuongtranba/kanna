        <title id="kanna-architecture-dark-title">How Kanna fits together</title>
        <desc id="kanna-architecture-dark-desc">Architecture diagram: the Kanna web app talks to a Bun server over WebSocket; its agent coordinator records every event, runs turns on the Claude Agent SDK or the Codex app-server, and those agents edit your project worktree and call your MCP servers and Kanna's own tools.</desc>
