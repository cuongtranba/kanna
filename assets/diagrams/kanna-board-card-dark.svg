      #kanna-board-card-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #kanna-board-card-dark-root .diagram-container { overflow-x: visible; }</style><marker id="kanna-board-card-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#aca2a2"/></marker><marker id="kanna-board-card-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff637e"/></marker><marker id="kanna-board-card-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4cb0e5"/></marker><marker id="kanna-board-card-dark-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#867e7e"/></marker></defs>
