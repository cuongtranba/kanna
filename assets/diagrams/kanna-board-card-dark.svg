        <title id="kanna-board-card-dark-title">One card, one worktree, one chat</title>
        <desc id="kanna-board-card-dark-desc">State diagram of a board card: Kanna moves it to In progress on Start work and creates its worktree and chat, the agent advances it one column when the work is verified, and only you move it to Done, which asks whether to merge, discard or keep the worktree.</desc>
