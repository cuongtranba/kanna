<svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kanna-loop-dark-title kanna-loop-dark-desc" id="kanna-loop-dark-root">
        <title id="kanna-loop-dark-title">How an autonomous loop iterates</title>
        <desc id="kanna-loop-dark-desc">Loop diagram: each iteration wakes with a fresh context, reads the chat task list, runs the verify oracle and stops when it passes, otherwise picks a task, delegates it to a background worker, and the worker settles the task, which wakes the next iteration.</desc>
