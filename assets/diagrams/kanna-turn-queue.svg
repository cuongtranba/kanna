<svg viewBox="0 0 1280 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kanna-turn-queue-title kanna-turn-queue-desc" id="kanna-turn-queue-root">
        <title id="kanna-turn-queue-title">Every trigger is a message to a chat</title>
        <desc id="kanna-turn-queue-desc">Fan-in diagram: a typed message, a cron job, a loop wake, a background subagent and a board card all enter one durable per-chat queue, which starts a turn only when the chat is idle and writes its output to the transcript.</desc>
