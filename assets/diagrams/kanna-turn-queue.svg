      #kanna-turn-queue-root .diagram-container { width: 100%; overflow-x: auto; }
      #kanna-turn-queue-root .diagram-container { overflow-x: visible; }</style><marker id="kanna-turn-queue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5f5556"/></marker><marker id="kanna-turn-queue-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff637e"/></marker><marker id="kanna-turn-queue-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006c9d"/></marker><marker id="kanna-turn-queue-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b7272"/></marker></defs>
