id: no-raw-websocket-ts
language: typescript
severity: error
message: Raw WebSocket is banned in src/client — use KannaSocket (src/client/app/socket.ts) instead.
note: |
  See adr-20260715-client-state-effect-architecture. KannaSocket owns the one
  client connection; consumers call socket.command/subscribe, never the
  WebSocket ctor.
files:
  - src/client/**
ignores:
  - src/client/**/*.adapter.ts
  - src/client/**/*.test.ts
  - src/client/**/*.test.tsx
  - src/client/lib/testing/**
  - src/client/adapters/testing/**
rule:
  any:
    - pattern: new WebSocket($$$ARGS)
    - pattern: WebSocket($$$ARGS)
